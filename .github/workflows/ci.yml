name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Reads `engines.node` from package.json, the same field Vercel builds
          # on, so CI and production run the same major. The binding dev
          # dependencies are jsdom 28.1.0 (^20.19.0 || ^22.12.0 || >=24.0.0) and
          # vitest 4.0.18 (^20.0.0 || ^22.0.0 || >=24.0.0); vite 5.2.6 is looser
          # (^18.0.0 || >=20.0.0). 24.x satisfies all three.
          node-version-file: package.json
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm test

      - run: npm run build
