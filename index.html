<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="src/assets/surfboard.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Open Graph needs absolute URLs; crawlers cannot resolve a relative
         path, and the apex 307s to www, so www is the canonical host. -->
    <link rel="canonical" href="https://www.cody-johnson.com/" />
    <meta
      name="description"
      content="Cody Johnson is a technical product owner and software engineer building Oasis Race Control, Track Tuner, Attend, and RideSense: real-time systems, operational data workflows, and the failure handling underneath them."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Cody Johnson" />
    <meta property="og:title" content="Cody Johnson | Technical Product Owner" />
    <meta
      property="og:description"
      content="Portfolio of active builds across real-time systems, dealership and motorsports operations, and data workflows, with the reliability decisions and the evidence behind each one."
    />
    <meta property="og:url" content="https://www.cody-johnson.com/" />
    <!-- JPEG, not SVG: LinkedIn, Facebook, Slack and X all decline to render
         SVG previews, which left every shared link without a card. -->
    <meta property="og:image" content="https://www.cody-johnson.com/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="2400" />
    <meta property="og:image:height" content="1260" />
    <meta
      property="og:image:alt"
      content="Cody Johnson's portfolio: the headline Ambiguous to shipped over a violet and amber gradient field."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Cody Johnson | Technical Product Owner" />
    <meta
      name="twitter:description"
      content="Portfolio of active builds across real-time systems, dealership and motorsports operations, and data workflows, with the reliability decisions and the evidence behind each one."
    />
    <meta name="twitter:image" content="https://www.cody-johnson.com/og-image.jpg" />
    <meta
      name="twitter:image:alt"
      content="Cody Johnson's portfolio: the headline Ambiguous to shipped over a violet and amber gradient field."
    />
    <title>Cody Johnson | Technical Product Owner</title>
    <meta name="theme-color" content="#08080a" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#eeece7" media="(prefers-color-scheme: light)" />
    <!-- Applies the stored theme before first paint. React sets the same
         attribute after mount, but that is a frame too late: a visitor who
         chose light would otherwise get a dark flash on every load. Keep the
         key and the accepted values in sync with SiteLayout. -->
    <script>
      (function () {
        var theme = 'dark';
        try {
          var stored = window.localStorage.getItem('cj-theme');
          if (stored === 'paper') stored = 'light';
          else if (stored === 'ink') stored = 'dark';
          if (stored === 'light' || stored === 'dark') theme = stored;
        } catch (e) {
          /* private mode - fall through to the default */
        }
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Source Serif 4: even-stroke display serif that holds up at paragraph size
         on the dark canvas. Instrument Sans: UI grotesque.
         JetBrains Mono: meta labels and counters.

         Two things about the Source Serif 4 request are deliberate. opsz 8..60
         is that face's own optical-size axis range - signal.css sets
         font-optical-sizing: auto, so the requested range has to match the
         face rather than be carried over from a previous one. And the weight
         ranges match the coverage the old display face had: legacy.css
         declares font-weight 300 and 350 on some large display elements, and
         those are meant to keep clamping up to 400, not render lighter. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400..700;1,8..60,400..600&family=Instrument+Sans:ital,wght@0,400..600;1,400..500&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
