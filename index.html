    <!-- Applies the stored theme before first paint. React sets the same
         attribute after mount, but that is a frame too late: a visitor who
         chose light would otherwise get a dark flash on every load. Keep the
         key and the accepted values in sync with SiteLayout. -->
    <script>
      (function () {
        var theme = 'dark';
        try {
          var stored = window.localStorage.getItem('cj-theme');
          if (stored === 'paper') stored = 'light';
          else if (stored === 'ink') stored = 'dark';
          if (stored === 'light' || stored === 'dark') theme = stored;
        } catch (e) {
          /* private mode - fall through to the default */
        }
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Source Serif 4: even-stroke display serif that holds up at paragraph size
         on the dark canvas. Instrument Sans: UI grotesque.
         JetBrains Mono: meta labels and counters.

         Two things about the Source Serif 4 request are deliberate. opsz 8..60
         is that face's own optical-size axis range - signal.css sets
         font-optical-sizing: auto, so the requested range has to match the
         face rather than be carried over from a previous one. And the weight
         ranges match the coverage the old display face had: legacy.css
         declares font-weight 300 and 350 on some large display elements, and
         those are meant to keep clamping up to 400, not render lighter.

         Caveat and Kalam carry the three hand-drawn wireframe pages and appear
         nowhere else. Without them those pages fall through to the generic
         `cursive` keyword, which is Comic Sans MS on Windows. Caveat is a
         variable face and the pages use 400, 600 and 700, so the whole
         400..700 range is requested; Kalam is static and only 400 and 700 are
         used, so only those two are.

         Barlow and Barlow Condensed are the typeface the Diaz on Demand
         video-first review chose over Oswald and Manrope, and they carry the
         two pages under /products/diaz-on-demand/video-first and nowhere else.
         Both are requested at 400, 500, 600 and 700, matching the source
         artifact, because the lifted stylesheet uses the whole span: 400 is
         inherited by `.dvf-canvas .lessonrow .n`, which sets a family and no
         weight, and 700 is set by six rules plus the bolded runs in the page's
         own notes. Both faces are static, not variable like Caveat above, so
         each listed weight is its own file; they are only fetched by a browser
         that renders one of those two pages, and dropping a weight does not
         save a request there, it just clamps the drawing to a weight nobody
         reviewed.

         Space Grotesk carries the Session Compare deck and appears nowhere
         else. The page names it in 11 rules: ten inline font-family
         declarations in src/content/sessionCompareSlides.js plus the .sc-page
         rule in SessionComparePage.css, which sets the family page-wide, so
         unweighted text lands on 400 and every rule beyond that uses only 500
         or 600. It is a variable face, but the request is the static list
         those rules ask for rather than a 400..600 range, because a range
         ships weight axes the deck never uses. That same deck also sets 600 on
         19 of its JetBrains Mono runs, which is why that face is requested at
         600 as well: with only 400 and 500 served the browser synthesizes bold
         off the 500 face and the stat numerals render a weight nobody drew.

         Oswald at 600 is requested for one element: `.dvf-canvas .gradpost
         .mono`, the oversized numeral on the poster tile. `.gradpost` is the
         "being replaced" exhibit, so it depicts the poster surface the product
         renders today, and it has to render the way the real product does. A
         case study whose "before" is subtly degraded by a missing font is
         arguing against a rigged comparison. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400..700;1,8..60,400..600&family=Instrument+Sans:ital,wght@0,400..600;1,400..500&family=JetBrains+Mono:wght@400;500;600&family=Caveat:wght@400..700&family=Kalam:wght@400;700&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600&family=Oswald:wght@600&display=swap"
      rel="stylesheet"
    />
