<!doctype html><meta charset="utf-8"><title>mermaid to excalidraw</title>
<div id="out">working</div>
<script type="module">
window.EXCALIDRAW_ASSET_PATH = "https://esm.sh/@excalidraw/excalidraw@0.18.0/dist/prod/";
try {
  const { parseMermaidToExcalidraw } = await import("https://esm.sh/@excalidraw/mermaid-to-excalidraw@1.1.2");
  const { convertToExcalidrawElements, exportToSvg, serializeAsJSON } = await import("https://esm.sh/@excalidraw/excalidraw@0.18.0");
  const { bounds } = await import("./lib.js");

  // One page, several drawings: ?drawing=<name> loads ./<name>.js, which names
  // the Mermaid source and the title and owns the two layout hooks below.
  const drawingName = new URLSearchParams(location.search).get("drawing");
  if (!drawingName) throw new Error("Name the drawing to build: ?drawing=how-it-broke or ?drawing=atomic-save");
  const drawing = (await import(`./${drawingName}.js`)).default;
  const mmd = await (await fetch(drawing.mmd)).text();

  const TITLE_SIZE = 36;
  const br = (t) => t.replace(/<br\s*\/?>/g, "\n");

  // Both drawings come from the one Mermaid file, parsed once per build, so
  // their words cannot drift. The wide one keeps Mermaid's left-to-right layout,
  // adjusted by drawing.adjustWide. The phone one keeps every element and only
  // moves it: drawing.stackForPhone.
  const VARIANTS = { wide: { phone: false }, phone: { phone: true } };

  // Converts a copy of the skeleton and reads back each container's height, so
  // a layout that narrows a box can know how tall its rewrapped text made it
  // before placing the box beneath it. Conversion gives every element a new
  // id, but it keeps skeleton order and appends each label's text element
  // after its container, so dropping the text elements restores the pairing.
  const measure = (skeleton) => {
    const sized = convertToExcalidrawElements(structuredClone(skeleton)).filter((el) => el.type !== "text");
    return Object.fromEntries(sized.map((el, i) => [skeleton[i].id, { width: el.width, height: el.height }]));
  };

  async function build({ phone }) {
    const { elements: skeleton, files } = await parseMermaidToExcalidraw(mmd, { themeVariables: { fontSize: "20px" } });
    for (const el of skeleton) {
      // The converter leaves Mermaid's <br> in the label text; Excalidraw wants \n.
      if (el.label?.text) el.label.text = br(el.label.text);
      if (typeof el.text === "string") el.text = br(el.text);
    }
    if (phone) drawing.stackForPhone(skeleton, { measure });
    else drawing.adjustWide(skeleton, { measure });
    // The title is part of the drawing, in the same hand as the boxes.
    const box = bounds(skeleton.filter((el) => el.type !== "arrow"));
    const title = phone ? drawing.phoneTitle : drawing.title;
    const titleHeight = TITLE_SIZE * 1.25 * title.split("\n").length;
    skeleton.push({ type: "text", text: title, fontSize: TITLE_SIZE, x: box.left, y: box.top - titleHeight - 36 });
    const elements = convertToExcalidrawElements(skeleton);
    const svg = await exportToSvg({ elements, appState: { exportBackground: false, exportEmbedScene: false }, files, exportPadding: 24 });
    return { elements, files, svg };
  }

  // Pass one only exists to make Excalidraw fetch and embed Excalifont. Text is
  // measured on a canvas, so until the face is registered with the document the
  // widths - and the masks that lift each arrow off its label - come from a
  // narrower fallback font.
  const first = await build(VARIANTS.wide);
  const src = new XMLSerializer().serializeToString(first.svg).match(/font-family:\s*Excalifont;\s*src:\s*url\(([^)]+)\)/);
  const face = new FontFace("Excalifont", `url(${src[1]})`);
  await face.load(); document.fonts.add(face);
  await document.fonts.load("20px Excalifont");

  const save = (name, body) => fetch(`/save/${name}`, { method: "POST", body });
  const out = document.getElementById("out");
  window.__boxes = {};
  for (const [name, variant] of Object.entries(VARIANTS)) {
    const { elements, files, svg } = await build(variant);
    const file = name === "wide" ? drawing.file : `${drawing.file}-phone`;
    await save(`${file}.svg`, new XMLSerializer().serializeToString(svg) + "\n");
    await save(`${file}.excalidraw`, serializeAsJSON(elements, { viewBackgroundColor: "#ffffff" }, files ?? {}, "local") + "\n");
    window.__boxes[name] = svg.getAttribute("viewBox");
    svg.style.cssText = "display:block;margin:24px;max-width:none";
    out.after(svg);
  }
  out.remove();
  window.__done = "ok";
} catch (e) { window.__done = "error: " + (e?.stack || e); document.getElementById("out").textContent = window.__done; }
</script>
